# Build and test on every pull request and push to main, so a PR shows real results
# before anyone tags a release.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test .\DynamicIsland.Windows.Tests\DynamicIsland.Windows.Tests.csproj -c Release -m:1
      - name: Build app
        run: dotnet build .\DynamicIsland.Windows\DynamicIsland.Windows.csproj -c Release -r win-x64
      # One-off verification of the exact model artifacts before removing this step.
      - name: Verify pinned upstream model downloads
        shell: pwsh
        run: |
          $base = 'https://huggingface.co/ggerganov/whisper.cpp/resolve/80da2d8bfee42b0e836fc3a9890373e5defc00a6/'
          $models = @{
            'ggml-base.en.bin' = 'a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002'
            'ggml-base.bin' = '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe'
          }
          foreach ($name in $models.Keys) {
            $path = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -Uri ($base + $name) -OutFile $path
            if ((Get-FileHash -Algorithm SHA256 $path).Hash -ne $models[$name]) { throw "Integrity check failed for $name" }
            Remove-Item $path
          }
